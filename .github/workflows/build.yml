# 在 Windows、Linux 与 macOS 上分别打包（PyInstaller 不能交叉编译）。
#
# 手动运行：GitHub 仓库 → Actions → 打包 → Run workflow，完成后在运行
# 页面底部下载各平台的程序；推送 v 开头的标签（如 v0.1.0）时，还会把
# 它们发布到对应的 Release。
name: 打包

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # 发布 Release 需要

env:
  # 构建脚本输出中文；Windows 机器默认的 cp1252 编码无法输出。
  PYTHONUTF8: "1"

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ClaudeStatus-windows-x64
          # 在较旧的系统上构建，生成的程序能在更多发行版上运行（glibc 2.35+）。
          - os: ubuntu-22.04
            artifact: ClaudeStatus-linux-x64
          - os: macos-latest
            artifact: ClaudeStatus-macos-arm64
          - os: macos-15-intel
            artifact: ClaudeStatus-macos-x64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: 安装 Qt 需要的系统库
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 \
            libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3

      - name: 安装依赖
        run: python -m pip install -r requirements-build.txt

      # 测试用例按 Windows 环境编写（Desktop 安装路径等）。
      - name: 运行测试
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t .

      # build.py 构建后会用演示数据在后台启动程序，渲染全部页面作为检查。
      - name: 打包并检查
        run: python build.py

      - name: 整理产物
        shell: bash
        run: |
          mkdir -p out
          case "$RUNNER_OS" in
            Windows)
              cp dist/ClaudeStatus.exe "out/${{ matrix.artifact }}.exe" ;;
            Linux)
              tar -czf "out/${{ matrix.artifact }}.tar.gz" -C dist claude-status ;;
            macOS)
              ditto -c -k --sequesterRsrc --keepParent \
                "dist/Claude Status.app" "out/${{ matrix.artifact }}.zip" ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
